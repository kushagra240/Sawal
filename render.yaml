# Render Blueprint for the Sawal monorepo.
# Secrets marked sync: false must be supplied in the Render Dashboard.
services:
  - type: web
    name: sawal-tarunkkumarsahu-api
    runtime: python
    plan: free
    region: singapore
    branch: feat/real-world-agent
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    buildFilter:
      paths:
        - api/**
        - benchmark/**
        - core/**
        - requirements.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODE
        value: auto
      - key: GEMMA_MODEL_ID
        value: gemma-4-26b-a4b-it
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMMA_THINKING_LEVEL
        value: minimal
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: LLM_TIMEOUT_SECONDS
        value: "15"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: SAWAL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SAWAL_DATABASE_PATH
        value: /tmp/sawal.db
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "20"
      - key: CORS_ORIGINS
        value: https://sawal-tarunkkumarsahu-web.onrender.com
      - key: FRONTEND_URL
        value: https://sawal-tarunkkumarsahu-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://sawal-tarunkkumarsahu-api.onrender.com/v1/oauth/google/callback

  - type: web
    name: sawal-tarunkkumarsahu-web
    runtime: node
    plan: free
    region: singapore
    branch: feat/real-world-agent
    autoDeployTrigger: commit
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - web/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 21.1.0
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://sawal-tarunkkumarsahu-api.onrender.com
